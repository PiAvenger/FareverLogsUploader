name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FareverLogs.Uploader.slnx

      - name: Publish
        run: >
          dotnet publish FareverLogs.Uploader/FareverLogs.Uploader.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true

      - name: Locate published output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path FareverLogs.Uploader -Recurse -Filter 'FareverLogs.Uploader-*.exe' |
            Where-Object { $_.DirectoryName -match '[\\/]publish$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            throw "Could not locate published FareverLogs.Uploader-*.exe in a publish folder"
          }
          $dir = $exe.DirectoryName
          # Zip only the contents of the publish folder (exe + dlls + native libs) into a single archive
          $zipName = [System.IO.Path]::GetFileNameWithoutExtension($exe.Name) + '.zip'
          $zipPath = Join-Path (Get-Location) $zipName
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zipPath -Force
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "zipname=$zipName" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.locate.outputs.path }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.zip }}
          generate_release_notes: true

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.zipname }}
          path: ${{ steps.locate.outputs.zip }}
